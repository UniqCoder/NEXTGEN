[project]
name = "sanjaya"
version = "0.1.0"
description = "SANJAYA engine: proven transmitter recipes from .IQ / .wav recordings (an offline signal-analysis brief)"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13", "pydantic>=2.6", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sanjaya = "sanjaya.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sanjaya*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
